<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список владельцев</title>
</head>
<body>
    <h1>Список владельцев</h1>
    <ul>
        {% for owner in owners %}
            <li>{{ owner.last_name }} {{ owner.first_name }} ({{ owner.birth_date }})</li>
        {% empty %}
            <li>Владельцы не найдены.</li>
        {% endfor %}
    </ul>
</body>
</html>
