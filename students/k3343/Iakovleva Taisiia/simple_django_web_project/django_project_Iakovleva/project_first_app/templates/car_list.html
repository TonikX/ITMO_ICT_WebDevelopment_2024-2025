<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список автомобилей</title>
</head>
<body>
    <h1>Список автомобилей</h1>
    <ul>
        {% for car in cars %}
            <li>{{ car.state_number }} - {{ car.brand }} {{ car.model }} ({{ car.color }})</li>
        {% empty %}
            <li>Автомобили не найдены.</li>
        {% endfor %}
    </ul>
</body>
</html>
