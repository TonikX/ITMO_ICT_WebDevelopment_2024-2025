<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Изменить{% else %}Создать{% endif %} владельца</title>
</head>
<body>

        {{ form.as_p }}
        <input type="submit" value="Сохранить">
    </form>
    <a href="/owner_list/">Get back - owner list</a>
</body>
</html>
