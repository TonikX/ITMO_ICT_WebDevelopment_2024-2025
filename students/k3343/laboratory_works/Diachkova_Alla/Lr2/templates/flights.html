{% extends 'base.html' %}
{% load static %}
{% load bootstrap3 %}
{% block content %}
    <h1>Flights: </h1>
    {% if flights %}
        {% for flight in flights %}
            <div>
                <h2><a href="{% url 'flight_info' flight.pk %}">{{ flight }}</a></h2>
                <p>{{ flight.description }}</p>
            </div>
        {% endfor %}
    {% bootstrap_pagination page_obj %}
    {% else %}
        <h2>No flights added yet</h2>
    {% endif %}
{% endblock %}
