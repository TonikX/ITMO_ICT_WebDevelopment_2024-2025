{% extends "base.html" %}

{% block content %}
    <h2>Удалить регистрацию</h2>
    <p>Вы уверены, что хотите удалить регистрацию для {{ registration.race.title }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'race_list' %}">Отмена</a>
    </form>
{% endblock %}
