{% extends "base.html" %}

{% block content %}
    <h2>Добавить комментарий к {{ race.title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить комментарий</button>
    </form>
    <a href="{% url 'race_detail' race.id %}">Назад</a>
{% endblock %}
