<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.pk %}Изменить{% else %}Создать{% endif %} автомобиль</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Изменить{% else %}Создать{% endif %} автомобиль</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <a href="{% url 'car-list' %}">Назад к списку автомобилей</a>
</body>
</html>
