<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Удалить автомобиль</title>
</head>
<body>
    <h1>Удалить автомобиль</h1>
    <p>Вы уверены, что хотите удалить {{ car.make }} {{ car.model }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'car-list' %}">Назад к списку автомобилей</a>
</body>
</html>
