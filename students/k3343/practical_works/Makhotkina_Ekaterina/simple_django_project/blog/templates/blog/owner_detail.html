<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали владельца: {{ owner.username }}</title>
</head>
<body>
    <h1>Детали владельца</h1>
    <p><strong>Имя пользователя:</strong> {{ owner.username }}</p>
    <p><strong>Номер паспорта:</strong> {{ owner.passport_number }}</p>
    <p><strong>Домашний адрес:</strong> {{ owner.home_address }}</p>
    <p><strong>Национальность:</strong> {{ owner.nationality }}</p>

    <a href="{% url 'owner-list' %}">Назад к списку владельцев</a>
</body>
</html>
