<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список автомобилей</title>
</head>
<body>
    <h1>Список автомобилей</h1>
    <ul>
        {% for car in cars %}
            <li>
                {{ car.make }} {{ car.model }} - {{ car.license_plate }}
                <a href="{% url 'car-update' car.pk %}">Изменить</a>
                <a href="{% url 'car-delete' car.pk %}">Удалить</a>
            </li>
        {% empty %}
            <li>Нет автомобилей.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'car_create' %}">Добавить автомобиль</a>
</body>
</html>
