<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car form</title>
</head>
<body>
    <h1>{% if view.object %}Update{% else %}Add{% endif %} Car owner</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if view.object %}Update{% else %}Create{% endif %} Car owner</button>
    </form>
</body>
</html>
