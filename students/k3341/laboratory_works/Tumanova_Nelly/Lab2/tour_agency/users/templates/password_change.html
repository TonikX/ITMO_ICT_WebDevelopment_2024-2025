{% extends 'base.html' %}

{% block content %}
    <form method="post" class="vertical-layout large-gap filled">
        <h1>Редактирование пароля</h1>
        {% csrf_token %}

        {% for field in form %}
            <div class="vertical-layout small-gap">
                <h3>{{ field.label }}</h3>
                {{ field }}
                {% if field.errors %}
                    <div class="filled filled--error">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="button button--dark centered">Сохранить</button>
    </form>
{% endblock %}
