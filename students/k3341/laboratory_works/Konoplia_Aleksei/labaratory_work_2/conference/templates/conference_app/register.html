{% extends "conference_app/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
  <h2>Регистрация нового пользователя</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p>Уже зарегистрированы? <a href="{% url 'login' %}">Войдите</a></p>
{% endblock %}
