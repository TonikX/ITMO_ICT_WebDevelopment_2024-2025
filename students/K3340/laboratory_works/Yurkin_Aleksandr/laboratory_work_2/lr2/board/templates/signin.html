{% extends 'base.html' %}
{% block content %}

<div class="col-md-6 mx-auto mt-5">

        <div class="card-body">
            <h2 class="card-title text-center text-primary">Войти в аккаунт</h2>

        </div>
    </div>
</div>

{% endblock %}
