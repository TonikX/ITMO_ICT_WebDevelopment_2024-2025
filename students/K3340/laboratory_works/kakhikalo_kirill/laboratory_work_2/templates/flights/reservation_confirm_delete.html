{% extends "flights/../base.html" %}
{% block title %}Удаление бронирования{% endblock %}
{% block content %}
<h1>Удаление бронирования</h1>
<p>Вы уверены, что хотите удалить бронирование для рейса {{ object.flight.flight_number }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'flight_detail' object.flight.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
