<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Owner Details</title>
</head>
<body>
    <h1>Car Owner Details</h1>
    <p>Last Name: {{ owner.last_name }}</p>

</html>
