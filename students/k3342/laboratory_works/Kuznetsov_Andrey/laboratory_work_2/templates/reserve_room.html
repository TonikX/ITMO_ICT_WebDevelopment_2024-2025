<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резервирование номера</title>
</head>
<body>
    <h1>Резервирование номера: {{ room.name }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Забронировать</button>
    </form>

    <a href="{% url 'hotel_detail' room.hotel.id %}">Назад к отелю</a>
</body>
</html>
