<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cars List</title>
</head>
<body>
    <h1>List of Cars</h1>
    <ul>
        {% for car in cars %}
            <li>
                <a href="{% url 'car_detail' car.id %}">{{ car.make }} {{ car.model }} - {{ car.license_plate }}</a>
            </li>
        {% empty %}
            <li>No cars found.</li>
        {% endfor %}
    </ul>
</body>
</html>
