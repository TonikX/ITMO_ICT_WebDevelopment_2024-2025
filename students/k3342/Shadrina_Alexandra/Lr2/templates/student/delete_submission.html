<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Submission</title>
</head>
<body>
<h2>Удалить ответ на "{{ submission.homework.subject }}"?</h2>

<p>Вы уверены, что хотите удалить этот ответ? Это действие нельзя будет отменить.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'submission_list' %}">Отмена</a>
</form>
</body>
</html>
