{% extends "base.html" %}

{% block title %}Добавить отзыв{% endblock %}

{% block content %}
    <header>
        <h1>Добавление отзыва</h1>
    </header>

    <main>
        <section class="room-details">
            <h2>Номер: {{ room.room_type }}</h2>
            <p><strong>Отель:</strong> {{ room.hotel.name }}</p>
        </section>

        <section class="review-form">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="submit-button">Добавить отзыв</button>
            </form>
        </section>

        <footer>
            <a href="{% url 'hotel_detail' room.hotel.id %}" class="cancel-button">Назад к отелю</a>
        </footer>
    </main>
{% endblock %}
