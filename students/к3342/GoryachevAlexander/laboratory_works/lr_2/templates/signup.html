{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <header>
        <h1>Регистрация</h1>
    </header>

    <main>
        <section class="signup-form">
            <h2>Создайте новый аккаунт</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="submit-button">Зарегистрироваться</button>
            </form>
            <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        </section>
    </main>
{% endblock %}
