{% extends "base.html" %}

{% block title %}{{ title }} | TravelWay{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2>{{ title }}</h2>

                <p class="text-muted">
                    {{ tour.title }} · {{ tour.country }}
                </p>

                <p>
                    Price per person:
                    <strong>{{ tour.price }} ₽</strong>
                </p>

                <p>
                    Available seats:
                    <strong>{{ tour.available_seats }}</strong>
                </p>

                <form method="post">
                    {{ csrf_input }}

                    {{ form.as_p()|safe }}

                    <button class="btn btn-primary">
                        Save booking
                    </button>

                    <a
                        href="{{ url('tour_detail', tour.pk) }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
