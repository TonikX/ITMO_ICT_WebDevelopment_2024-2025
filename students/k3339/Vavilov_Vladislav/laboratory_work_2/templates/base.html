<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TravelWay{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .tour-card {
            height: 100%;
            transition: transform .2s, box-shadow .2s;
        }

        .tour-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,.10);
        }

        .hero {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url('tour_list') }}">
            TravelWay
        </a>

        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="{{ url('sold_tours') }}">
                Sold tours
            </a>

            <a class="nav-link" href="{{ url('tour_list') }}">
                Tours
            </a>

            {% if user.is_authenticated %}

                <a class="nav-link" href="{{ url('booking_list') }}">
                    My bookings
                </a>

                {% if user.is_staff %}
                    <a class="nav-link" href="{{ url('staff_dashboard') }}">
                        Administration
                    </a>
                {% endif %}

                <span class="navbar-text mx-3">
                    {{ user.username }}
                </span>

                <form method="post" action="{{ url('logout') }}">
                    {{ csrf_input }}
                    <button class="btn btn-outline-light btn-sm">
                        Log out
                    </button>
                </form>

            {% else %}

                <a class="nav-link" href="{{ url('login') }}">
                    Log in
                </a>

                <a class="btn btn-primary btn-sm ms-2" href="{{ url('register') }}">
                    Register
                </a>

            {% endif %}

        </div>
    </div>
</nav>


<div class="container py-4">

    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
