site_name: Лабораторная № 1 | Сокеты и HTTP
site_description: Документация к лабораторной работе по веб-программированию — Вавилов Владислав, К3339
site_author: Вавилов Владислав
site_url: ""
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ru
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Главная: index.md
  - О работе:
      - Цель и архитектура: overview.md
      - Запуск и требования: launch.md
  - Практические задания:
      - "01 · Обмен по UDP": tasks/udp.md
      - "02 · Площадь по TCP": tasks/tcp.md
      - "03 · HTTP-страница": tasks/http.md
      - "04 · Многопользовательский чат": tasks/chat.md
      - "05 · Журнал оценок": tasks/grades.md
  - Проверка результатов: verification.md
  - Вывод: conclusion.md

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

copyright: Вавилов Владислав · ИТМО · К3339 · 2026
