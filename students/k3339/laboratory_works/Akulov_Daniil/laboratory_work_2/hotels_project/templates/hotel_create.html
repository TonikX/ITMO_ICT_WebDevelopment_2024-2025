{% extends 'base.html' %}
{% block content %}

    <h2 class="mb-4">Регистрация отеля</h2>
    <form method="post">{% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Название отвеля</label>
            {{ form.name }}
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Адрес</label>
            {{ form.address }}
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            {{ form.description }}
        </div>
        <button type="submit" class="btn btn-success">Зарегистрировать</button>
    </form>

{% endblock %}
