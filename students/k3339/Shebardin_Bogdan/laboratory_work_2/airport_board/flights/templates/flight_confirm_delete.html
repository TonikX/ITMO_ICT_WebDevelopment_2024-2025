{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mx-auto mt-5 text-center" style="max-width: 500px;">
    <h3 class="mb-4 text-danger"><i class="bi bi-exclamation-triangle"></i> Удалить рейс?</h3>
    <p>Вы уверены, что хотите удалить рейс <strong>{{ object.flight_number }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'flight_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
