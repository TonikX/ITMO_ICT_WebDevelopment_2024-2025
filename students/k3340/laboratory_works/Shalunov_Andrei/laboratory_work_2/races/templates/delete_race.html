{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="delete-race-container">
    <h2>Удаление гонки</h2>
    <p>Вы уверены, что хотите удалить гонку "{{ race.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Удалить</button>
    </form>
    <p><a href="{% url 'race_list' %}" class="action-link">Отменить</a></p>
</div>
{% endblock %}
