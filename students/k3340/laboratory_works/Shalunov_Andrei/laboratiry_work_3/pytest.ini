[pytest]
DJANGO_SETTINGS_MODULE = laboratiry_work_3.settings
python_files = tests.py test_*.py *_tests.py
addopts = -q --disable-warnings --maxfail=1 --cov --cov-report=term-missing --reuse-db

log_cli = true
log_cli_level = INFO  
log_cli_format = %(asctime)s | %(levelname)-8s |  %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S