<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Detail</title>
</head>
<body>
    <h1>Owner Details</h1>
    <p><strong>Имя:</strong> {{ owner.first_name }}</p>
    <p><strong>Фамилия:</strong> {{ owner.last_name }}</p>
    <p><strong>Никнейм:</strong> {{ owner.username }}</p>
    <p><strong>Дата рождения:</strong> {{ owner.birthday_date }}</p>
    <p><strong>Номер паспорта:</strong> {{ owner.passport_number }}</p>
    <p><strong>Домашний адрес:</strong> {{ owner.home_address }}</p>
    <p><strong>Национальность:</strong> {{ owner.nationality }}</p>
</body>
</html>
