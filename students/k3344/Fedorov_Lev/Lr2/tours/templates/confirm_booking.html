<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение брони</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Подтверждение брони</h1>
    <p>Вы точно подтверждаете это бронирование?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Подтверждаю</button>
        <a href="{% url 'admin:index' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
