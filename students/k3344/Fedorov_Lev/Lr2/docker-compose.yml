services:
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_DB: tour_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tour_network

networks:
  tour_network:

volumes:
  postgres_data:
