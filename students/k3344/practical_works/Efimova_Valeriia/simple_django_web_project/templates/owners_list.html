<!-- blog/templates/owners_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список владельцев</title>
</head>
<body>
    <h1>Список владельцев автомобилей</h1>
    <ul>
        {% for owner in owners %}
            <li>{{ owner.first_name }} {{ owner.last_name }}, Дата рождения: {{ owner.birth_date }}</li>
        {% endfor %}
    </ul>
</body>
</html>
