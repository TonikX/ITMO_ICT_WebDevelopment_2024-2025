<!-- templates/blog/car_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Update Car</title>
</head>
<body>
    <h1>{% if form.instance.id %}Update Car{% else %}Add Car{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'car_list' %}">Back to list</a>
</body>
</html>
