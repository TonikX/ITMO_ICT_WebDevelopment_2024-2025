<!DOCTYPE html>
<html>
<head>
    <title>Confirm Delete Ownership</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>Confirm Delete Ownership</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this ownership?</p>
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'ownership_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
