{% extends 'base.html' %}

{% block title %}Список рейсов{% endblock %}

{% block content %}
<h2>Доступные рейсы</h2>
<ul>
    {% for flight in flights %}
        <li>
            <a href="{% url 'flight_detail' flight.pk %}">Рейс {{ flight.flight_number }} - {{ flight.airline }}</a>
        </li>
    {% empty %}
        <li>Нет доступных рейсов</li>
    {% endfor %}
</ul>
{% endblock %}
